<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Боевая база · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#202124;--muted:#707277;--paper:#f5f5f2;--line:#dededb;--red:#ca2929;--dark:#202124}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.55 Manrope,sans-serif;color:var(--ink)}button,input,select{font:inherit}.top{height:8px;background:var(--red)}.brand{font:700 13px/1.3 Unbounded;letter-spacing:-.05em}.brand b{color:var(--red)}.auth{max-width:460px;margin:7vh auto;padding:34px;background:#fff;border:1px solid var(--line);box-shadow:12px 12px 0 #dededb}.auth h1{font:700 32px/1.13 Unbounded;letter-spacing:-.07em;margin:24px 0 10px}.auth p{color:var(--muted)}label{font-size:12px;font-weight:800;display:block;margin:16px 0 6px}input,select{width:100%;border:1px solid var(--line);border-radius:2px;padding:12px;background:#fff}.btn{border:0;background:var(--red);color:#fff;padding:12px 16px;font:600 11px Unbounded;cursor:pointer;margin-top:20px}.demo{font-size:12px;background:#fff4f3;border-left:3px solid var(--red);padding:13px;margin-top:22px}.shell{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 8px)}aside{background:var(--dark);color:#fff;padding:23px 14px;position:sticky;top:0;height:100vh}.sidebrand{color:#fff;margin:0 7px 36px}.sidebrand b{color:#fff}.role{font-size:11px;color:#aaa;margin:0 7px 15px}.nav{display:grid;gap:2px}.nav button{border:0;border-left:2px solid transparent;color:#b7b7b7;background:transparent;text-align:left;padding:10px 11px;cursor:pointer}.nav button:hover,.nav button.active{background:#303134;color:#fff;border-color:var(--red)}.exit{position:absolute;bottom:22px;left:21px;background:transparent;border:0;color:#aaa;cursor:pointer}main{padding:43px clamp(20px,5vw,72px);max-width:1120px}.eyebrow{font:600 10px Unbounded;color:var(--red);letter-spacing:.12em;text-transform:uppercase}.headline{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:24px;margin-bottom:28px}.headline h1{font:700 clamp(28px,4vw,42px)/1.15 Unbounded;letter-spacing:-.07em;margin:10px 0 0}.card{background:#fff;border:1px solid var(--line);padding:22px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{min-height:130px;cursor:pointer}.quick b{display:block;font:600 14px Unbounded;letter-spacing:-.04em}.quick span{display:block;color:var(--red);font-size:23px;margin-top:28px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair{padding:13px;border:1px solid var(--line)}.pair small{display:block;color:var(--muted);font-size:11px}.section{display:none}.section.active{display:block}.kb{display:grid;grid-template-columns:280px 1fr;gap:12px}.kbnav{display:grid;align-content:start;gap:2px}.kbnav button{border:1px solid var(--line);background:#fff;text-align:left;padding:9px;cursor:pointer;font-size:13px}.kbnav button.active{border-color:var(--red);color:var(--red)}.article{background:#fff;border:1px solid var(--line);padding:24px}.article h2{font:700 24px/1.15 Unbounded;letter-spacing:-.06em;margin:0 0 17px}.article h3{font:600 12px Unbounded;margin:22px 0 7px}.article ul{padding-left:20px}.script{background:#fff8f7;border-left:3px solid var(--red);padding:17px;margin-bottom:12px}.script small{font:600 10px Unbounded;color:var(--red)}.script p{white-space:pre-line;margin:9px 0}.copy{background:var(--red);color:#fff;border:0;padding:9px 11px;font:600 10px Unbounded;cursor:pointer}.users{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;font-family:Unbounded;color:var(--muted)}.status{font-size:11px;padding:4px 7px;background:#eef6ef;color:#28703c}.status.off{background:#f6eeee;color:#a23434}.tool{border:1px solid var(--line);background:#fff;padding:7px;cursor:pointer;font-size:12px;margin-right:4px}.note{color:var(--muted);font-size:13px}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:16px 10px}.sidebrand{margin:0 7px 14px}.role,.exit{display:none}.nav{grid-template-columns:repeat(2,1fr)}.nav button{font-size:12px;padding:8px}.grid{grid-template-columns:1fr 1fr}.kb{grid-template-columns:1fr}.kbnav{grid-template-columns:1fr 1fr}.headline{display:block}main{padding:27px 17px}.auth{margin:3vh 16px}.profile{grid-template-columns:1fr}.users{display:block;overflow:auto;white-space:nowrap}}
</style>
<div class="top"></div><div id="app"></div><script src="app.js"></script>
</html>
