<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Боевая база ТСК ГРУПП</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet"><style>:root{--r:#ca2525;--i:#222;--m:#6d6d6d;--l:#dededb}*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:var(--i);font:15px/1.55 Manrope,sans-serif}.top{height:8px;background:var(--r)}header{height:72px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand,h1,h2,h3,.tag{font-family:Unbounded,sans-serif}.brand{font-size:13px;line-height:1.35}.brand b,.tag{color:var(--r)}.muted{font-size:12px;color:var(--m)}.app{display:grid;grid-template-columns:280px 1fr}aside{background:#202124;padding:18px 13px;min-height:calc(100vh - 80px)}input{width:100%;background:#303134;border:1px solid #555;color:#fff;padding:12px;font:13px Manrope;margin-bottom:14px}.nav{display:grid;gap:2px}.nav button{border:0;border-left:2px solid transparent;background:transparent;color:#bbb;text-align:left;padding:10px;cursor:pointer;font:13px Manrope}.nav button.active,.nav button:hover{background:#303134;color:#fff;border-color:var(--r)}main{max-width:1030px;padding:42px clamp(18px,5vw,70px)}.hero{border-bottom:2px solid var(--i);padding-bottom:25px;margin-bottom:30px}.hero h1{font-size:clamp(28px,4vw,46px);line-height:1.12;letter-spacing:-.07em;margin:11px 0}.hero p{max-width:660px;color:var(--m);margin:0}.article{display:none}.article.active{display:block}h2{font-size:27px;letter-spacing:-.05em;line-height:1.2;margin:0 0 20px}.block,.script{background:#fff;border:1px solid var(--l);padding:21px;margin-bottom:14px}.block h3{font-size:13px;margin:0 0 11px}.block p{margin:0 0 10px}.block ul,.block ol{margin:7px 0;padding-left:21px}.block li{margin:5px 0}.script{border-left:3px solid var(--r);background:#fff8f7}.script small{font:600 10px Unbounded;color:var(--r)}.script p{white-space:pre-line;margin:11px 0 0}.copy{margin-top:14px;border:0;background:var(--r);color:#fff;padding:10px 13px;font:600 10px Unbounded;cursor:pointer}.hint{font-size:12px;color:var(--m)}@media(max-width:720px){header{padding:0 18px}.muted{display:none}.app{display:block}aside{min-height:auto}.nav{grid-template-columns:1fr 1fr}.nav button{font-size:11px;padding:8px}main{padding:27px 18px}}</style><div class="top"></div><header><div class="brand"><b>ТСК</b> ГРУПП<br>БОЕВАЯ БАЗА</div><div class="muted">Внутренняя база знаний · v1.0</div></header><div class="app"><aside><input id="q" placeholder="Поиск: цена, замер, недозвон"><nav class="nav" id="nav"></nav></aside><main><div class="hero"><div class="tag">Коммерческий блок</div><h1>Что делать.<br>Как действовать.<br>Что говорить.</h1><p>Рабочие инструкции и готовые тексты ТСК ГРУПП. Выбери раздел или найди ситуацию по слову.</p></div><section id="content"></section></main></div><script>const S=[['Быстрый старт','ТВОЙ РЕЗУЛЬТАТ|Найти подходящего клиента, получить телефон, провести первичную квалификацию и довести до согласованного замера. Не импровизируй в деньгах и обещаниях.|Алгоритм: объект → площадь → район → дизайн-проект → телефон → звонок → проверка бюджета → два окна на замер → вводные руководителю.'],['О компании','КОРОТКО|ТСК ГРУПП — инженерно-строительная компания премиальных ремонтов квартир, домов и коммерческих помещений под ключ в Москве и области. Руководитель в строительстве с 2003 года; компания с 2007 года; более 150 объектов; гарантия 12 месяцев.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПРЕЗЕНТАЦИЯ|Здравствуйте. Меня зовут {{employee_name}}, я представляю ТСК ГРУПП. Мы выполняем премиальные ремонты квартир, домов и коммерческих помещений под ключ в Москве и Московской области. Компания работает с 2007 года, руководитель в строительстве с 2003 года. Берём на себя работы, материалы, снабжение, подрядчиков, технический контроль, УК, бюджет и сдачу объекта.'],['Продукт и ценность','ЧТО ПРОДАЁМ|Премиальный комплексный ремонт под ключ. Клиент покупает готовый объект и возможность не превращать ремонт во вторую работу.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · КОРОТКИЙ ОФФЕР|Мы берём на себя весь ремонт — от инженерии, снабжения и подрядчиков до взаимодействия с управляющей компанией и контроля бюджета. Вы принимаете ключевые решения, всё остальное ведём мы.'],['Клиент и фильтры','НАШ КЛИЕНТ|Ценит качество, сроки и предсказуемость; готов работать по договору и прозрачному бюджету; хочет одного ответственного за объект.|ОРИЕНТИР|Квартиры от 100 м², дома от 200 м²; допуск от 60–80 м²; Москва и МО до 40–50 км.|НЕ НАШ КЛИЕНТ|Ремонт «за миллион», премиум по цене бригады, отказ от договора, бесконечный торг, самостоятельное управление черновыми материалами.'],['Цены, бюджеты и сроки','ОРИЕНТИРЫ|Простая отделка: от 35–40 тыс. ₽/м² за работы. Премиальная: от 50–60 тыс. ₽/м² за работы. 60 м²: 5–6 млн ₽; 100 м²: 8–10 млн ₽; дом 200 м²: 16–20 млн ₽. Материалы и мебель считаются отдельно.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ЦЕНА|Точная стоимость зависит от состояния объекта, проекта и уровня отделки. По работам премиальный ремонт обычно начинается примерно от 50–60 тысяч рублей за м². Точный бюджет определяем после осмотра и подготовки сметы. Подскажите, такой уровень бюджета вам в целом подходит?'],['Общие правила общения','КАК ГОВОРИМ|Коротко и по-человечески. Ответь на вопрос, затем задай следующий. Не обещай цену, срок, скидку или процент без согласования. Не спорь и не оставляй диалог без следующего действия.|ЗАПРЕЩЕНО|«У нас лучшие мастера», «самые низкие цены», «сделаем идеально», «скинем 10%».'],['Площадки: Авито, Яндекс Услуги, Профи','ЦЕЛЬ|Собрать вводные и перевести клиента в телефонный разговор. Публикуй отдельные объявления для квартир, домов и коммерции. Не используй ложную минимальную цену.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРВЫЙ ОТВЕТ|Здравствуйте. Да, занимаемся комплексным ремонтом под ключ. Подскажите, пожалуйста: что за объект, какая площадь, где находится и есть ли готовый дизайн-проект?'],['Чаты ЖК, посёлков и сообществ','ПРАВИЛО|Выбирай активные чаты собственников бизнес- и премиум-сегмента, где разрешены рекомендации. Не дублируй сообщение чаще правил чата и не спорь с администраторами.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ЧАТ ЖК|Добрый день, соседи. ТСК ГРУПП выполняет премиальные ремонты квартир под ключ в Москве и области. Берём на себя стройку, инженерию, снабжение, подрядчиков, УК, бюджет и сроки. Компания работает с 2007 года, реализовано более 150 объектов. По вопросам: {{employee_name}}, {{employee_phone}}.'],['Партнёры','КОГО ИЩЕМ|Дизайнеров, архитекторов, брокеров, комплектаторов и поставщиков премиального сегмента. Не обещай конкретный процент: только «до 10% от фактически оплаченных строительных работ, условия согласует руководитель».|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ДИЗАЙНЕРУ|Здравствуйте, {{partner_name}}. Меня зовут {{employee_name}}, я представляю ТСК ГРУПП. Мы занимаемся комплексной реализацией премиальных интерьеров: стройка, инженерия, снабжение, подрядчики и технический контроль. Ищем дизайнеров и архитекторов для постоянного партнёрства. За реализованный проект предусмотрено вознаграждение до 10% от фактически оплаченных строительных работ.'],['Первичная переписка','ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРВЫЙ ОТВЕТ|Здравствуйте, {{client_name}}. Меня зовут {{employee_name}}, ТСК ГРУПП. Да, занимаемся комплексным ремонтом под ключ. Подскажите, пожалуйста: что за объект, какая площадь, где находится и есть ли дизайн-проект?|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРЕХОД К ТЕЛЕФОНУ|Спасибо, задачу понял. Чтобы не растягивать переписку и задать несколько технических вопросов, оставьте, пожалуйста, номер телефона. Свяжусь с вами на 5–7 минут.'],['Получение телефона','ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ЗАПРОС ТЕЛЕФОНА|Оставьте, пожалуйста, номер телефона. Коротко уточню состояние объекта, сроки и формат работ — после этого сможем понять, есть ли смысл назначать осмотр.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · НЕ ХОЧЕТ ДАВАТЬ НОМЕР|Понимаю. Тогда можно продолжить здесь. Напишите, пожалуйста: площадь, адрес или район, текущее состояние объекта, есть ли дизайн-проект и когда планируете начинать.'],['Квалификационный звонок','ОБЯЗАТЕЛЬНЫЕ ВОПРОСЫ|Объект, адрес, площадь, состояние, объём работ, дизайн-проект, старт, общий бюджет, кто принимает решение, когда посмотреть объект.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРЕХОД К ЗАМЕРУ|По вашим вводным объект нам подходит. Следующий шаг — осмотр помещения и личное обсуждение задачи. Встреча занимает около 1–1,5 часа. Сейчас предложу два ближайших окна.'],['Запись на замер','ПРАВИЛО|Замер бесплатный для квалифицированного клиента. Предлагай два конкретных окна, согласованных с руководителем. На встрече нужен принимающий решения человек.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ЗАПИСЬ НА ЗАМЕР|Можем посмотреть объект {{slot_1}} или {{slot_2}}. Какой вариант удобнее?|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПОДТВЕРЖДЕНИЕ|Отлично, фиксирую: {{date}}, {{time}}, адрес {{address}}. Встреча займёт примерно 1–1,5 часа. Если есть дизайн-проект или планировка, подготовьте, пожалуйста.'],['Подтверждение, перенос и недозвон','ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · НЕДОЗВОН|{{client_name}}, добрый день. Не смог дозвониться по вашему обращению о ремонте. Напишите, пожалуйста, когда будет удобно связаться на 5–7 минут.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРЕНОС|Понял. Давайте сразу зафиксируем новую дату, чтобы вопрос не потерялся. Можем предложить {{slot_1}} или {{slot_2}}.'],['Возражения','ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · «У ВАС ДОРОГО»|Понимаю. Мы не конкурируем с отдельной бригадой по минимальной цене. В стоимость входит управление всем объектом, технический контроль, снабжение, подрядчики и ответственность за результат. Подскажите, с каким предложением вы сравниваете?|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · «СДЕЛАЙТЕ СКИДКУ»|Индивидуальные условия обсуждает руководитель после понимания состава проекта. Сначала нужно определить реальный объём работ и бюджет.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · «НУЖНО ОЧЕНЬ БЫСТРО»|Срок зависит от технологии и состава проекта. Мы не обещаем невозможное ради договора. После изучения объекта подготовим реальный график.'],['Повторные касания','ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПОСЛЕ ПЕРВОГО СООБЩЕНИЯ|{{client_name}}, добрый день. Возвращаюсь по вашему объекту. Удалось посмотреть мой вопрос по площади и текущему состоянию помещения?|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ФИНАЛЬНОЕ КАСАНИЕ|{{client_name}}, добрый день. Не буду перегружать сообщениями. Оставлю контакт на случай, если вопрос комплексного ремонта снова станет актуальным. Буду на связи.'],['Когда подключать руководителя','ПОДКЛЮЧАЙ|При индивидуальной цене, скидке, проценте, нестандартном или крупном объекте, техническом вопросе вне базы, конфликте или сомнении.|ТЕКСТ ДЛЯ ОТПРАВКИ ЛИДУ · ПЕРЕДАЧА РУКОВОДИТЕЛЮ|{{client_name}}, спасибо за вводные. Здесь лучше подключить руководителя компании, чтобы корректно обсудить техническую часть и условия. Я передам ему информацию и согласую удобное время связи.'],['Запреты и ошибки','ЗАПРЕЩЕНО|Придумывать цену или срок, обещать скидку и фиксированные 10%, обсуждать внутреннюю экономику, отправлять внутренние регламенты, обесценивать конкурентов, спорить, хамить и менять утверждённые условия.'],['Материалы компании','РАЗДЕЛ ДЛЯ НАПОЛНЕНИЯ|Презентация, портфолио, кейсы и ссылки будут добавлены руководителем. Материалы — только для просмотра.'],['Частые вопросы','БЫСТРЫЕ ОТВЕТЫ|Смета — после осмотра и проекта. Скидка — через руководителя. Срок — после изучения объекта. Неизвестная ситуация — собрать вводные и обратиться к прямому руководителю.']];let nav=document.querySelector('#nav'),out=document.querySelector('#content');function cp(b){navigator.clipboard.writeText(b.previousElementSibling.innerText);b.textContent='СКОПИРОВАНО';setTimeout(()=>b.textContent='СКОПИРОВАТЬ',1200)}function draw(q=''){nav.innerHTML='';out.innerHTML='';S.filter(x=>(x[0]+x[1]).toLowerCase().includes(q.toLowerCase())).forEach((x,i)=>{let id='s'+i,b=document.createElement('button');b.textContent=x[0];b.onclick=()=>open(id);nav.append(b);let a=document.createElement('article');a.className='article';a.id=id;a.innerHTML='<h2>'+x[0]+'</h2>'+x[1].split('|').reduce((z,v,j)=>j%2?z+'<p>'+v+'</p>':z+(v.includes('ТЕКСТ ДЛЯ')?'<div class="script"><small>'+v+'</small>':'<div class="block"><h3>'+v+'</h3>'),'').replace(/<p>[^]*?(?=<div|$)/g,m=>m+'</div>')+'<p class="hint">Красные блоки — тексты для отправки. Внутренние правила не копируются.</p>';a.querySelectorAll('.script').forEach(e=>{let b=document.createElement('button');b.className='copy';b.textContent='СКОПИРОВАТЬ';b.onclick=()=>cp(b);e.append(b)});out.append(a);if(i===0)open(id)})}function open(id){document.querySelectorAll('.article,.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');[...nav.children].find(x=>x.textContent===document.getElementById(id).querySelector('h2').textContent).classList.add('active')}q.oninput=e=>draw(e.target.value);draw()</script>
