<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSK CRM v3 Workflow</title>
  <meta name="description" content="Рабочий кликабельный прототип CRM v3: менеджер, РОП, замерщик, сметчик, источники, запросы и журнал.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap&subset=cyrillic');

    :root {
      --bg: #f3efe7;
      --paper: #fffdf9;
      --ink: #181713;
      --muted: #716a60;
      --line: #ded6c8;
      --line2: #c7baa6;
      --dark: #1e211b;
      --green: #2f6b56;
      --blue: #286278;
      --red: #9d4038;
      --gold: #a9742e;
      --sage: #e5efe8;
      --sky: #e5eef2;
      --rose: #f7e5e1;
      --wheat: #f6ecd6;
      --gray: #ece7df;
      --radius: 8px;
      --shadow: 0 18px 45px rgba(30, 33, 27, .09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(30,33,27,.035) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(rgba(30,33,27,.028) 1px, transparent 1px) 0 0 / 36px 36px,
        var(--bg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button, .button {
      min-height: 38px;
      border: 1px solid var(--dark);
      border-radius: var(--radius);
      padding: 9px 12px;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    button:hover, .button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(30,33,27,.12); }
    button.secondary { background: var(--paper); color: var(--ink); border-color: var(--line2); }
    button.ghost { background: transparent; color: var(--ink); border-color: transparent; box-shadow: none; }
    button.danger { background: var(--red); border-color: var(--red); }
    button.small { min-height: 30px; padding: 6px 9px; font-size: 12px; }
    button:disabled { cursor: not-allowed; opacity: .5; transform: none; box-shadow: none; }
    input, select, textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line2);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
    }
    textarea { min-height: 92px; resize: vertical; }
    label { display: grid; gap: 6px; color: #3d3830; font-size: 12px; font-weight: 700; }
    a { color: var(--blue); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .shell { min-height: 100vh; display: grid; grid-template-columns: 276px minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      background: var(--dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: auto;
    }
    .brand { padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .logo-row { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #efd59f;
      color: var(--dark);
      font: 700 23px/1 "IBM Plex Serif", Georgia, serif;
      box-shadow: inset 0 0 0 1px rgba(30,33,27,.18);
    }
    .brand h1 { margin: 0; font: 700 25px/1 "IBM Plex Serif", Georgia, serif; }
    .brand p { margin: 5px 0 0; color: #cdc6bb; font-size: 12px; line-height: 1.4; }
    .nav { display: grid; gap: 7px; }
    .nav button {
      width: 100%;
      justify-content: flex-start;
      background: transparent;
      color: #f1ede5;
      border-color: transparent;
      text-align: left;
      box-shadow: none;
    }
    .nav button.active, .nav button:hover {
      transform: none;
      background: rgba(255,255,255,.105);
      border-color: rgba(255,255,255,.18);
      box-shadow: none;
    }
    .role-card {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.16);
      display: grid;
      gap: 9px;
    }
    .role-card label { color: #cdc6bb; }
    .role-card select { background: #292b24; border-color: rgba(255,255,255,.2); color: #fff; }
    .role-note { color: #bdb6aa; font-size: 12px; line-height: 1.45; }

    .content { padding: 24px; min-width: 0; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--gold); }
    h2, h3, p { margin-top: 0; }
    .title {
      margin: 5px 0 0;
      max-width: 940px;
      font: 700 40px/.98 "IBM Plex Serif", Georgia, serif;
    }
    .subtitle { margin: 8px 0 0; color: var(--muted); line-height: 1.45; max-width: 860px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .grid { display: grid; gap: 14px; }
    .metrics { grid-template-columns: repeat(5, minmax(132px, 1fr)); margin-bottom: 14px; }
    .two { grid-template-columns: minmax(0, 1.25fr) minmax(330px, .75fr); align-items: start; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric, .panel {
      background: rgba(255,253,249,.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(30,33,27,.04);
    }
    .metric {
      min-height: 112px;
      padding: 14px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
    }
    .metric:hover { border-color: var(--line2); box-shadow: var(--shadow); }
    .metric .num { font-size: 30px; line-height: 1; font-weight: 700; margin-bottom: 8px; }
    .metric .label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .metric .hint { display: block; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .panel { overflow: hidden; }
    .panel-head {
      min-height: 56px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .panel-body { padding: 16px; }
    .toolbar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 12px;
    }
    .period {
      min-width: 250px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      background: #e7dfd1;
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .period button {
      min-height: 32px;
      border: 0;
      color: var(--ink);
      background: transparent;
      box-shadow: none;
      padding: 6px 8px;
    }
    .period button.active { background: var(--paper); box-shadow: 0 1px 7px rgba(30,33,27,.08); }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    table { width: 100%; min-width: 980px; border-collapse: collapse; }
    th, td { padding: 10px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13px; }
    th { background: #f7f1e7; color: #514a40; font-size: 11px; text-transform: uppercase; white-space: nowrap; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #fff9ec; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      background: var(--sage);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.blue { background: var(--sky); color: var(--blue); }
    .badge.gold { background: var(--wheat); color: #875918; }
    .badge.red { background: var(--rose); color: var(--red); }
    .badge.gray { background: var(--gray); color: #615a50; }
    .notice {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 11px;
      display: grid;
      gap: 4px;
    }
    .notice + .notice { margin-top: 8px; }
    .notice strong { font-size: 13px; }
    .notice span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .pipeline {
      display: grid;
      grid-template-columns: repeat(6, minmax(190px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .stage {
      min-height: 280px;
      background: #fbf7ef;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
    }
    .stage-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
      font-weight: 700;
      font-size: 13px;
    }
    .lead-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .lead-card:hover { border-color: var(--line2); box-shadow: 0 8px 18px rgba(30,33,27,.08); }
    .lead-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .lead-card span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs button { min-height: 34px; background: #fff; color: var(--ink); border-color: var(--line2); }
    .tabs button.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .form-grid .wide { grid-column: 1 / -1; }
    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(720px, 100%);
      background: var(--paper);
      border-left: 1px solid var(--line2);
      box-shadow: -30px 0 70px rgba(30,33,27,.2);
      transform: translateX(105%);
      transition: transform .22s ease;
      z-index: 20;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .drawer-head h2 { margin: 0; font: 700 24px/1.05 "IBM Plex Serif", Georgia, serif; }
    .drawer-body { padding: 18px; overflow: auto; }
    .timeline { display: grid; gap: 9px; }
    .event {
      border-left: 3px solid var(--line2);
      padding: 0 0 0 10px;
    }
    .event strong { display: block; font-size: 13px; }
    .event span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark);
      color: #fff;
      border-radius: var(--radius);
      padding: 10px 14px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 40;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .empty { padding: 24px; color: var(--muted); text-align: center; }
    .kpi-line { display: grid; gap: 8px; }
    .kpi-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .kpi-row:hover { color: var(--blue); }
    .split-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

    @media (max-width: 1080px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .content { padding: 16px; }
      .metrics, .two, .three { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .title { font-size: 31px; }
    }
    @media (max-width: 680px) {
      .topbar { display: grid; }
      .period { width: 100%; min-width: 0; }
      .toolbar, .form-grid { grid-template-columns: 1fr; }
      .title { font-size: 27px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>

  <script>
    const STORE = 'tsk-crm-v3-workflow-state';

    const roles = {
      admin: { title: 'Игорь · админ', note: 'Видит всё: отдел, сотрудников, источники, запросы, архив и журнал.' },
      rop: { title: 'РОП', note: 'Видит отдел продаж, менеджеров, контроль и воронку.' },
      manager: { title: 'Менеджер', note: 'Видит только свои лиды, источники и задачи.' },
      measurer: { title: 'Замерщик', note: 'Видит только переданные ему замеры.' },
      estimator: { title: 'Сметчик', note: 'Видит только переданные в смету замеры.' },
      assistant: { title: 'Ассистент', note: 'Видит операционный контур для помощи руководителю.' }
    };

    const employeesSeed = [
      { id: 1, name: 'Игорь Подольский', role: 'admin', active: true, login: 'igor' },
      { id: 2, name: 'Елена РОП', role: 'rop', active: true, login: 'rop' },
      { id: 3, name: 'Николай Рыжих', role: 'manager', active: true, login: 'nikolay' },
      { id: 4, name: 'Анастасия Майер', role: 'manager', active: true, login: 'anastasia' },
      { id: 5, name: 'Дмитрий Замер', role: 'measurer', active: true, login: 'zamer' },
      { id: 6, name: 'Олег Сметчик', role: 'estimator', active: true, login: 'smeta' },
      { id: 7, name: 'Анна Ассистент', role: 'assistant', active: true, login: 'assist' }
    ];

    const sourceTypes = ['Telegram', 'Дизайнеры', 'Партнёры', 'Сарафан', 'Клиенты', 'Холодная база'];
    const statuses = ['Новый лид', 'Первичный контакт', 'Прогретый', 'Квалификация', 'Прогрев до замера', 'Замер назначен', 'Передан замерщику', 'Замер принят', 'Замер проведен', 'Передан сметчику', 'Смета в работе', 'Смета посчитана', 'Договор', 'Отказ'];

    function seed() {
      const now = new Date();
      const day = (n) => new Date(now.getTime() + n * 86400000).toISOString().slice(0, 10);
      return {
        role: 'admin',
        view: 'dashboard',
        period: 'week',
        filter: null,
        employees: employeesSeed,
        sources: [
          { id: 1, name: 'Telegram чат ЖК Сердце столицы', type: 'Telegram', ownerId: 3, link: 'https://t.me/example_tsk_chat', bonus: false },
          { id: 2, name: 'Дизайнер Мария / ProDom', type: 'Дизайнеры', ownerId: 4, link: 'https://t.me/mariya151112', bonus: true },
          { id: 3, name: 'Алексей из клуба строителей', type: 'Партнёры', ownerId: 1, link: 'https://t.me/igorpodolskyi_tsk', bonus: true },
          { id: 4, name: 'Рекомендация от клиента Новослободская', type: 'Сарафан', ownerId: 3, link: '', bonus: false },
          { id: 5, name: 'Холодная база дизайнеров', type: 'Холодная база', ownerId: 4, link: '', bonus: false }
        ],
        leads: [
          { id: 1, client: 'Петрова Мария', phone: '+7 *** 41-22', object: 'Квартира 94 м2, дизайнерский проект', managerId: 3, measurerId: 5, estimatorId: 6, sourceId: 2, status: 'Смета посчитана', nextAction: 'Дожим после сметы', nextDate: day(-1), amountPre: 2700000, amountFinal: 2480000, archived: false, createdAt: day(-18), updatedAt: day(-1), notes: 'Клиенту важны сроки и спокойная реализация проекта.' },
          { id: 2, client: 'Анна ЖК Река', phone: '+7 *** 88-10', object: 'Квартира 76 м2', managerId: 3, measurerId: 5, estimatorId: null, sourceId: 1, status: 'Передан замерщику', nextAction: 'Замерщик должен принять заявку', nextDate: day(0), amountPre: 1800000, amountFinal: 0, archived: false, createdAt: day(0), updatedAt: day(0), notes: 'Первичный контакт был, просит выезд.' },
          { id: 3, client: 'Сергей коммерция', phone: '+7 *** 33-90', object: 'Офис 210 м2', managerId: 4, measurerId: 5, estimatorId: 6, sourceId: 3, status: 'Замер принят', nextAction: 'Провести замер и передать в смету', nextDate: day(1), amountPre: 4600000, amountFinal: 0, archived: false, createdAt: day(-5), updatedAt: day(0), notes: 'Коммерческий объект, нужен контроль РОПа.' },
          { id: 4, client: 'Илья дом', phone: '+7 *** 16-70', object: 'Дом 180 м2', managerId: 4, measurerId: null, estimatorId: null, sourceId: 4, status: 'Квалификация', nextAction: 'Уточнить бюджет и сроки', nextDate: day(2), amountPre: 5200000, amountFinal: 0, archived: false, createdAt: day(-2), updatedAt: day(-1), notes: 'Рекомендация, нужно аккуратно прогреть до замера.' },
          { id: 5, client: 'Новый лид из чата', phone: '+7 *** 00-45', object: 'Квартира, площадь неизвестна', managerId: 3, measurerId: null, estimatorId: null, sourceId: 1, status: 'Новый лид', nextAction: 'Связаться и квалифицировать', nextDate: day(0), amountPre: 0, amountFinal: 0, archived: false, createdAt: day(0), updatedAt: day(0), notes: 'Необработанный лид.' },
          { id: 6, client: 'Архивный отказ', phone: '+7 *** 10-10', object: 'Мелкий ремонт', managerId: 3, measurerId: null, estimatorId: null, sourceId: 5, status: 'Отказ', nextAction: 'Закрыто', nextDate: day(-10), amountPre: 0, amountFinal: 0, archived: true, createdAt: day(-30), updatedAt: day(-10), notes: 'Отказ по бюджету.' }
        ],
        requests: [
          { id: 1, type: 'lead', objectId: 1, employeeId: 3, field: 'Источник', before: 'Дизайнер Мария / ProDom', after: 'Алексей из клуба строителей', reason: 'Клиент пришел через партнера, источник надо уточнить', status: 'pending', createdAt: stamp(-2) }
        ],
        kb: [
          { id: 1, section: 'Скрипты', title: 'Первичный звонок', closedFor: [] },
          { id: 2, section: 'Презентации', title: 'TSK Premium+', closedFor: [] },
          { id: 3, section: 'Регламенты', title: 'Передача в замер', closedFor: [3] },
          { id: 4, section: 'О компании', title: 'Позиционирование и сильные стороны', closedFor: [] }
        ],
        audit: [
          logItem('system', null, 1, 'Создан рабочий прототип CRM v3', 'Роли, клики, замер, смета, запросы, журнал'),
          logItem('lead', 2, 3, 'Лид передан замерщику', 'Анна ЖК Река'),
          logItem('lead', 3, 5, 'Замер принят', 'Сергей коммерция: дата согласована')
        ]
      };
    }

    let state = load();
    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const s = seed();
      localStorage.setItem(STORE, JSON.stringify(s));
      return s;
    }
    function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
    function resetDemo() { localStorage.removeItem(STORE); state = seed(); save(); render(); toast('Демо-данные обновлены'); }

    const fmt = new Intl.NumberFormat('ru-RU');
    const money = (n) => n ? fmt.format(n) + ' ₽' : 'не указано';
    const h = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const byId = (arr, id) => arr.find(x => x.id === Number(id));
    const employee = (id) => byId(state.employees, id) || { name: 'Не назначен', role: '' };
    const source = (id) => byId(state.sources, id) || { name: 'Не указан', type: '' };
    const currentRole = () => state.role;
    const currentEmployeeId = () => ({ manager: 3, measurer: 5, estimator: 6, rop: 2, assistant: 7, admin: 1 })[state.role] || 1;
    const canSeeAll = () => ['admin', 'rop', 'assistant'].includes(state.role);
    const canApprove = () => ['admin', 'rop'].includes(state.role);
    const canManageEmployees = () => state.role === 'admin';
    const canSeeArchive = () => state.role === 'admin';

    function stamp(offsetHours = 0) {
      const d = new Date(Date.now() + offsetHours * 3600000);
      return d.toISOString().slice(0, 16).replace('T', ' ');
    }
    function logItem(type, objectId, employeeId, action, details, before = '', after = '') {
      return { id: Math.floor(Math.random() * 1000000), at: stamp(), type, objectId, employeeId, action, details, before, after };
    }
    function addLog(type, objectId, action, details, before = '', after = '') {
      state.audit.unshift(logItem(type, objectId, currentEmployeeId(), action, details, before, after));
    }
    function nextId(arr) { return Math.max(0, ...arr.map(x => x.id)) + 1; }

    function periodLabel() {
      return ({ day: 'день', week: 'неделя', month: 'месяц', year: 'год' })[state.period];
    }
    function inScopeByRole(lead) {
      if (lead.archived && !canSeeArchive()) return false;
      if (state.role === 'manager') return lead.managerId === currentEmployeeId() && !lead.archived;
      if (state.role === 'measurer') return lead.measurerId === currentEmployeeId() && ['Передан замерщику', 'Замер принят', 'Замер проведен'].includes(lead.status);
      if (state.role === 'estimator') return lead.estimatorId === currentEmployeeId() && ['Передан сметчику', 'Смета в работе', 'Смета посчитана'].includes(lead.status);
      return !lead.archived;
    }
    function visibleLeads() { return state.leads.filter(inScopeByRole); }
    function filteredLeads() {
      let rows = visibleLeads();
      const f = state.filter;
      if (!f) return rows;
      if (f.kind === 'status') rows = rows.filter(l => f.value.includes(l.status));
      if (f.kind === 'attention') rows = rows.filter(needsAttention);
      if (f.kind === 'employee') rows = rows.filter(l => l.managerId === f.id);
      if (f.kind === 'source') rows = rows.filter(l => l.sourceId === f.id);
      return rows;
    }
    function isOverdue(lead) {
      const today = new Date().toISOString().slice(0, 10);
      return lead.nextDate && lead.nextDate < today && !['Отказ', 'Договор'].includes(lead.status);
    }
    function upcoming(lead) {
      if (!lead.nextDate) return false;
      const today = new Date();
      const date = new Date(lead.nextDate + 'T00:00:00');
      const diff = Math.round((date - new Date(today.toISOString().slice(0,10))) / 86400000);
      return diff >= 0 && diff <= 2;
    }
    function needsAttention(lead) {
      return isOverdue(lead) || lead.status === 'Передан замерщику' || lead.status === 'Передан сметчику' || lead.status === 'Новый лид';
    }

    const navByRole = {
      admin: ['dashboard', 'summary', 'leads', 'base', 'pipeline', 'measurements', 'estimates', 'sources', 'employees', 'knowledge', 'requests', 'archive', 'audit'],
      rop: ['dashboard', 'summary', 'leads', 'pipeline', 'measurements', 'sources', 'requests', 'audit'],
      assistant: ['dashboard', 'summary', 'leads', 'base', 'pipeline', 'measurements', 'estimates', 'sources', 'knowledge', 'requests', 'audit'],
      manager: ['dashboard', 'summary', 'leads', 'sources', 'knowledge'],
      measurer: ['dashboard', 'measurements', 'knowledge'],
      estimator: ['dashboard', 'estimates', 'knowledge']
    };
    const navNames = {
      dashboard: 'Дашборд',
      summary: 'Сводка',
      leads: 'Лиды в работе',
      base: 'База лидов',
      pipeline: 'Воронка',
      measurements: 'Замеры',
      estimates: 'Сметы',
      sources: 'Источники',
      employees: 'Сотрудники',
      knowledge: 'База знаний',
      requests: 'Запросы',
      archive: 'Архив лидов',
      audit: 'Журнал'
    };

    function setRole(role) {
      state.role = role;
      const allowed = navByRole[role];
      if (!allowed.includes(state.view)) state.view = allowed[0];
      state.filter = null;
      save();
      render();
    }
    function setView(view, filter = null) {
      state.view = view;
      state.filter = filter;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function setPeriod(p) { state.period = p; save(); render(); }

    function render() {
      const allowed = navByRole[state.role];
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="shell">
          <aside class="sidebar">
            <div class="brand">
              <div class="logo-row"><div class="mark">TSK</div><div><h1>CRM v3</h1><p>рабочий прототип отдела продаж</p></div></div>
              <p>Лид → контакт → замер → смета → контроль. Без лишнего шума.</p>
            </div>
            <nav class="nav">${allowed.map(v => `<button class="${state.view === v ? 'active' : ''}" onclick="setView('${v}')">${navNames[v]}</button>`).join('')}</nav>
            <div class="role-card">
              <label>Проверка роли
                <select onchange="setRole(this.value)">
                  ${Object.entries(roles).map(([id, r]) => `<option value="${id}" ${state.role === id ? 'selected' : ''}>${r.title}</option>`).join('')}
                </select>
              </label>
              <div class="role-note">${roles[state.role].note}</div>
            </div>
          </aside>
          <main class="content">
            ${topbar()}
            ${screen()}
          </main>
        </div>
      `;
    }

    function topbar() {
      const title = navNames[state.view] || 'CRM';
      const subtitles = {
        dashboard: 'Главные счетчики за выбранный период. Каждый счетчик открывает живую таблицу.',
        summary: 'Отдельная сводка по сотрудникам и своим лидам, без смешивания с дашбордом.',
        leads: 'Рабочие лиды текущей роли. Менеджер видит только своё.',
        base: 'Полная база лидов по доступу. Архив отделен от активной работы.',
        pipeline: 'Читаемая воронка: общий вид и фильтр по менеджеру.',
        measurements: 'Передача от менеджера к замерщику: передано, принято, замерено.',
        estimates: 'Передача от замера к сметчику: принято в работу, посчитано, суммы.',
        sources: 'Источники по типам, владельцам, ссылкам и статистике.',
        employees: 'Найм, увольнение, роли и перераспределение базы.',
        knowledge: 'Материалы компании и частичные ограничения доступа.',
        requests: 'Подтверждение правок лида или источника с историей было/стало.',
        archive: 'Архив лидов доступен только админу.',
        audit: 'Компактный журнал действий с переходом в карточку объекта.'
      };
      const periodNeeded = ['dashboard', 'summary', 'pipeline', 'measurements', 'estimates', 'audit'].includes(state.view);
      return `<div class="topbar">
        <div><div class="eyebrow">${roles[state.role].title}</div><h1 class="title">${title}</h1><p class="subtitle">${subtitles[state.view] || ''}</p></div>
        <div class="actions">
          ${periodNeeded ? periodControl() : ''}
          ${state.view === 'leads' ? '<button onclick="openLeadForm()">+ Лид</button>' : ''}
          ${state.view === 'sources' ? '<button onclick="openSourceForm()">+ Источник</button>' : ''}
          ${state.view === 'employees' && canManageEmployees() ? '<button onclick="openEmployeeForm()">Нанять</button>' : ''}
        </div>
      </div>`;
    }
    function periodControl() {
      return `<div class="period">
        ${['day','week','month','year'].map(p => `<button class="${state.period === p ? 'active' : ''}" onclick="setPeriod('${p}')">${({day:'день',week:'неделя',month:'месяц',year:'год'})[p]}</button>`).join('')}
      </div>`;
    }

    function screen() {
      return ({
        dashboard: dashboard(),
        summary: summary(),
        leads: leadsScreen(false),
        base: leadsScreen(true),
        pipeline: pipeline(),
        measurements: measurements(),
        estimates: estimates(),
        sources: sourcesScreen(),
        employees: employeesScreen(),
        knowledge: knowledge(),
        requests: requests(),
        archive: archive(),
        audit: audit()
      })[state.view] || dashboard();
    }

    function dashboard() {
      const leads = visibleLeads();
      const metrics = [
        { n: leads.filter(l => l.status === 'Новый лид').length, label: 'Новые лиды', hint: 'за ' + periodLabel(), filter: { kind: 'status', value: ['Новый лид'] } },
        { n: leads.filter(l => l.status === 'Новый лид').length, label: 'Необработанные', hint: 'надо взять в работу', filter: { kind: 'status', value: ['Новый лид'] } },
        { n: leads.filter(l => ['Передан замерщику','Замер принят','Замер проведен'].includes(l.status)).length, label: 'Замеры', hint: 'передано / принято / замерено', filter: { kind: 'status', value: ['Передан замерщику','Замер принят','Замер проведен'] } },
        { n: leads.filter(l => ['Передан сметчику','Смета в работе','Смета посчитана'].includes(l.status)).length, label: 'Сметы', hint: 'передано сметчику', filter: { kind: 'status', value: ['Передан сметчику','Смета в работе','Смета посчитана'] } },
        { n: money(leads.reduce((s,l) => s + (l.amountFinal || l.amountPre || 0), 0)), label: 'Потенциал', hint: 'предварительно / итог', filter: null }
      ];
      return `
        <div class="grid metrics">${metrics.map(m => metric(m)).join('')}</div>
        <div class="grid two">
          <section class="panel">
            <div class="panel-head"><h2>Что требует внимания</h2><button class="secondary" onclick="setView('leads', {kind:'attention'})">Все задачи</button></div>
            <div class="panel-body">${attentionList()}</div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>Маршрут лида</h2></div>
            <div class="panel-body kpi-line">
              ${routeRow('Менеджер', 'Новый лид → контакт → квалификация → прогрев до замера')}
              ${routeRow('Замерщик', 'Передано → принято → замерено → передано в смету')}
              ${routeRow('Сметчик', 'Принято в работу → смета посчитана → суммы зафиксированы')}
              ${routeRow('Руководитель', 'Видит зависания, запросы правок и журнал действий')}
            </div>
          </section>
        </div>
      `;
    }
    function metric(m) {
      const onclick = m.filter ? `onclick='setView("leads", ${JSON.stringify(m.filter)})'` : '';
      return `<button class="metric" ${onclick}><div class="num">${h(m.n)}</div><div class="label">${h(m.label)}</div><span class="hint">${h(m.hint)}</span></button>`;
    }
    function routeRow(a, b) { return `<div class="notice"><strong>${h(a)}</strong><span>${h(b)}</span></div>`; }
    function attentionList() {
      const rows = visibleLeads().filter(needsAttention);
      if (!rows.length) return '<div class="empty">Сейчас зависаний нет.</div>';
      return rows.map(l => `<div class="notice" onclick="openLead(${l.id})" style="cursor:pointer"><strong>${h(l.client)} · ${h(l.status)}</strong><span>${h(l.nextAction)} · ${h(employee(l.managerId).name)} · ${isOverdue(l) ? 'просрочено' : 'контроль'}</span></div>`).join('');
    }

    function summary() {
      if (state.role === 'manager') {
        const mine = visibleLeads();
        return `<div class="grid metrics">
          ${metric({ n: mine.length, label:'Мои лиды', hint:'в работе', filter:null })}
          ${metric({ n: mine.filter(l => l.status === 'Новый лид').length, label:'Необработанные', hint:'сначала их', filter:{kind:'status', value:['Новый лид']} })}
          ${metric({ n: mine.filter(isOverdue).length, label:'Просрочено', hint:'дедлайн прошел', filter:{kind:'attention'} })}
          ${metric({ n: mine.filter(upcoming).length, label:'Подходит срок', hint:'ближайшие 2 дня', filter:null })}
        </div>${leadsTable(mine)}`;
      }
      const managers = state.employees.filter(e => e.role === 'manager' && e.active);
      return `<section class="panel"><div class="panel-head"><h2>Отдел продаж</h2><span class="muted">РОП отдельно, менеджеры отдельно</span></div><div class="panel-body"><div class="table-wrap"><table>
        <thead><tr><th>Сотрудник</th><th>Лидов в работе</th><th>Необработанные</th><th>Просрочено</th><th>Ближайшие 2 дня</th><th>Действие</th></tr></thead>
        <tbody>${managers.map(m => {
          const rows = state.leads.filter(l => l.managerId === m.id && !l.archived);
          return `<tr class="clickable" onclick="setView('leads',{kind:'employee',id:${m.id}})"><td>${h(m.name)}</td><td>${rows.length}</td><td>${rows.filter(l=>l.status==='Новый лид').length}</td><td>${rows.filter(isOverdue).length}</td><td>${rows.filter(upcoming).length}</td><td><button class="small secondary">Открыть</button></td></tr>`;
        }).join('')}</tbody></table></div></div></section>`;
    }

    function leadsScreen(base) {
      let rows = base ? state.leads.filter(l => !l.archived || canSeeArchive()) : filteredLeads();
      if (!base) rows = rows.filter(l => !l.archived);
      return `<section class="panel">
        <div class="panel-head"><h2>${base ? 'База лидов' : 'Рабочий список'}</h2><span class="muted">${state.filter ? 'Открыт фильтр из дашборда/сводки' : 'Клик по строке открывает карточку'}</span></div>
        <div class="panel-body">
          ${leadToolbar()}
          ${leadsTable(rows)}
        </div>
      </section>`;
    }
    function leadToolbar() {
      return `<div class="toolbar">
        <label>Поиск<input id="leadSearch" placeholder="клиент, объект, телефон" oninput="clientFilter(this.value)"></label>
        <label>Статус<select onchange="setView('leads', this.value ? {kind:'status', value:[this.value]} : null)"><option value="">Все</option>${statuses.map(s => `<option>${s}</option>`).join('')}</select></label>
        <label>Источник<select onchange="this.value && setView('leads',{kind:'source',id:Number(this.value)})"><option value="">Все</option>${state.sources.map(s => `<option value="${s.id}">${h(s.name)}</option>`).join('')}</select></label>
        <label>Ответственный<select ${state.role === 'manager' ? 'disabled' : ''} onchange="this.value && setView('leads',{kind:'employee',id:Number(this.value)})"><option value="">Все</option>${state.employees.filter(e=>e.role==='manager').map(e => `<option value="${e.id}">${h(e.name)}</option>`).join('')}</select></label>
        <button class="secondary" onclick="state.filter=null;save();render()">Сброс</button>
      </div>`;
    }
    function clientFilter(q) {
      document.querySelectorAll('[data-lead-row]').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
      });
    }
    function leadsTable(rows) {
      if (!rows.length) return '<div class="empty">Нет лидов по текущему фильтру.</div>';
      return `<div class="table-wrap"><table><thead><tr>
        <th>Клиент</th><th>Источник</th><th>Статус</th>${state.role === 'manager' ? '' : '<th>Ответственный</th>'}<th>Следующий шаг</th><th>Сумма</th><th>Контроль</th>
      </tr></thead><tbody>${rows.map(l => `<tr class="clickable" data-lead-row onclick="openLead(${l.id})">
        <td><strong>${h(l.client)}</strong><br><span class="muted">${h(l.object)} · ${h(l.phone)}</span></td>
        <td>${sourceLink(source(l.sourceId))}<br><span class="badge gray">${h(source(l.sourceId).type)}</span></td>
        <td>${statusBadge(l.status)}</td>
        ${state.role === 'manager' ? '' : `<td>${h(employee(l.managerId).name)}</td>`}
        <td>${h(l.nextAction)}<br><span class="muted">${h(l.nextDate)}</span></td>
        <td>${money(l.amountFinal || l.amountPre)}</td>
        <td>${isOverdue(l) ? '<span class="badge red">просрочено</span>' : upcoming(l) ? '<span class="badge gold">подходит срок</span>' : '<span class="badge">ок</span>'}</td>
      </tr>`).join('')}</tbody></table></div>`;
    }
    function sourceLink(s) { return s.link ? `<a href="${h(s.link)}" target="_blank" rel="noopener">${h(s.name)}</a>` : h(s.name); }
    function statusBadge(s) {
      const cls = s.includes('Смет') ? 'blue' : s.includes('Замер') || s.includes('Передан') ? 'gold' : s === 'Отказ' ? 'red' : '';
      return `<span class="badge ${cls}">${h(s)}</span>`;
    }

    function pipeline() {
      const stages = ['Новый лид','Первичный контакт','Квалификация','Прогрев до замера','Замер назначен','Смета посчитана'];
      const rows = visibleLeads();
      return `<section class="panel"><div class="panel-head"><h2>Воронка за ${periodLabel()}</h2><span class="muted">Клик по стадии или карточке открывает детали</span></div><div class="panel-body">
        <div class="tabs"><button class="active">Общая</button>${state.employees.filter(e=>e.role==='manager').map(e=>`<button onclick="setView('leads',{kind:'employee',id:${e.id}})">${h(e.name)}</button>`).join('')}</div>
        <div class="pipeline">${stages.map(st => {
          const list = rows.filter(l => l.status === st || (st === 'Смета посчитана' && ['Передан сметчику','Смета в работе','Смета посчитана'].includes(l.status)));
          return `<div class="stage"><div class="stage-title" onclick='setView("leads",{kind:"status",value:["${st}"]})' style="cursor:pointer"><span>${h(st)}</span><span>${list.length}</span></div>${list.map(l => `<article class="lead-card" onclick="openLead(${l.id})"><strong>${h(l.client)}</strong><span>${h(l.nextAction)}</span><div class="chips">${statusBadge(l.status)}</div></article>`).join('') || '<div class="muted">Пусто</div>'}</div>`;
        }).join('')}</div></div></section>`;
    }

    function measurements() {
      const rows = visibleLeads().filter(l => ['Передан замерщику','Замер принят','Замер проведен'].includes(l.status));
      return `<section class="panel"><div class="panel-head"><h2>Замеры</h2><span class="muted">Менеджер передает, замерщик принимает и завершает</span></div><div class="panel-body">${leadsTable(rows)}${measurementActions(rows)}</div></section>`;
    }
    function measurementActions(rows) {
      if (state.role !== 'measurer' && state.role !== 'admin') return '';
      return `<div class="grid three" style="margin-top:14px">${rows.map(l => `<div class="notice"><strong>${h(l.client)}</strong><span>${h(l.status)}</span><div class="actions">${l.status === 'Передан замерщику' ? `<button class="small" onclick="changeLeadStatus(${l.id}, 'Замер принят')">Принять</button>` : ''}${l.status === 'Замер принят' ? `<button class="small" onclick="changeLeadStatus(${l.id}, 'Замер проведен')">Замерено</button><button class="small secondary" onclick="handoffEstimate(${l.id})">В смету</button>` : ''}</div></div>`).join('')}</div>`;
    }

    function estimates() {
      const rows = visibleLeads().filter(l => ['Передан сметчику','Смета в работе','Смета посчитана'].includes(l.status));
      return `<section class="panel"><div class="panel-head"><h2>Сметы</h2><span class="muted">Потенциал появляется после принятия сметчиком</span></div><div class="panel-body">${leadsTable(rows)}${estimateActions(rows)}</div></section>`;
    }
    function estimateActions(rows) {
      if (state.role !== 'estimator' && state.role !== 'admin') return '';
      return `<div class="grid three" style="margin-top:14px">${rows.map(l => `<div class="notice"><strong>${h(l.client)}</strong><span>${h(l.status)} · ${money(l.amountFinal || l.amountPre)}</span><div class="actions">${l.status === 'Передан сметчику' ? `<button class="small" onclick="changeLeadStatus(${l.id}, 'Смета в работе')">В работу</button>` : ''}${l.status === 'Смета в работе' ? `<button class="small" onclick="finishEstimate(${l.id})">Смета посчитана</button>` : ''}</div></div>`).join('')}</div>`;
    }

    function sourcesScreen() {
      const rows = state.sources.filter(s => canSeeAll() || s.ownerId === currentEmployeeId());
      return `<section class="panel"><div class="panel-head"><h2>Источники</h2><span class="muted">Тип, владелец, ссылка, статистика</span></div><div class="panel-body"><div class="table-wrap"><table>
        <thead><tr><th>Источник</th><th>Тип</th><th>Владелец</th><th>Лиды</th><th>Замеры</th><th>Сметы</th><th>Закрыто</th><th>Действия</th></tr></thead>
        <tbody>${rows.map(s => {
          const leads = state.leads.filter(l => l.sourceId === s.id);
          return `<tr class="clickable" onclick="openSource(${s.id})"><td>${sourceLink(s)}</td><td><span class="badge gray">${h(s.type)}</span></td><td>${h(employee(s.ownerId).name)}</td><td>${leads.length}</td><td>${leads.filter(l=>l.status.includes('Замер')).length}</td><td>${leads.filter(l=>l.status.includes('Смет')).length}</td><td>${leads.filter(l=>l.status==='Договор').length}</td><td><button class="small secondary" onclick="event.stopPropagation();openSourceRequest(${s.id})">Запросить правку</button></td></tr>`;
        }).join('')}</tbody></table></div></div></section>`;
    }

    function employeesScreen() {
      if (!canManageEmployees()) return '<section class="panel"><div class="empty">Управление сотрудниками доступно только админу.</div></section>';
      return `<section class="panel"><div class="panel-head"><h2>Сотрудники и роли</h2><button onclick="openEmployeeForm()">Нанять</button></div><div class="panel-body"><div class="table-wrap"><table>
        <thead><tr><th>Сотрудник</th><th>Роль</th><th>Логин</th><th>Статус</th><th>База</th><th>Действия</th></tr></thead>
        <tbody>${state.employees.map(e => {
          const base = state.leads.filter(l => [l.managerId,l.measurerId,l.estimatorId].includes(e.id)).length + state.sources.filter(s => s.ownerId === e.id).length;
          const protectedAdmin = e.role === 'admin';
          return `<tr><td>${h(e.name)}</td><td>${h(roles[e.role]?.title || e.role)}</td><td>${h(e.login)}</td><td>${e.active ? '<span class="badge">работает</span>' : '<span class="badge red">уволен / доступ закрыт</span>'}</td><td>${base}</td><td class="actions">${protectedAdmin ? '<span class="muted">админа не увольнять</span>' : e.active ? `<button class="small danger" onclick="fireEmployee(${e.id})">Уволить</button>` : `<button class="small secondary" onclick="toast('Перед удалением нужно перераспределить базу')">Удалить</button>`}</td></tr>`;
        }).join('')}</tbody></table></div></div></section>`;
    }

    function knowledge() {
      const rows = state.kb.filter(k => !k.closedFor.includes(currentEmployeeId()) || canSeeAll());
      return `<section class="panel"><div class="panel-head"><h2>База знаний</h2><span class="muted">Ограничение доступа на уровне материала</span></div><div class="panel-body"><div class="grid three">${rows.map(k => `<div class="notice"><strong>${h(k.section)} · ${h(k.title)}</strong><span>${k.closedFor.length ? 'Закрыто для: ' + k.closedFor.map(id=>employee(id).name).join(', ') : 'Открыто всем по роли'}</span>${canManageEmployees() ? `<button class="small secondary" onclick="toggleKb(${k.id})">Закрыть/открыть менеджеру</button>` : ''}</div>`).join('')}</div></div></section>`;
    }

    function requests() {
      const rows = state.requests.filter(r => canApprove() || r.employeeId === currentEmployeeId());
      return `<section class="panel"><div class="panel-head"><h2>Запросы изменений</h2><span class="badge ${rows.filter(r=>r.status==='pending').length ? 'red' : ''}">${rows.filter(r=>r.status==='pending').length} новых</span></div><div class="panel-body"><div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Кто</th><th>Объект</th><th>Поле</th><th>Было</th><th>Стало</th><th>Статус</th><th>Действия</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="clickable" onclick="openRequest(${r.id})"><td>${r.id}</td><td>${h(employee(r.employeeId).name)}</td><td>${h(r.type)} #${r.objectId}</td><td>${h(r.field)}</td><td>${h(r.before)}</td><td>${h(r.after)}</td><td>${requestBadge(r.status)}</td><td>${canApprove() && r.status === 'pending' ? `<button class="small" onclick="event.stopPropagation();approveRequest(${r.id})">Одобрить</button><button class="small secondary" onclick="event.stopPropagation();clarifyRequest(${r.id})">Уточнить</button><button class="small danger" onclick="event.stopPropagation();rejectRequest(${r.id})">Отклонить</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8">Запросов нет.</td></tr>'}</tbody></table></div></div></section>`;
    }
    function requestBadge(s) { return `<span class="badge ${s==='pending'?'gold':s==='approved'?'':'red'}">${({pending:'ждет',approved:'одобрен',rejected:'отклонен',clarify:'уточнение'})[s] || s}</span>`; }

    function archive() {
      if (!canSeeArchive()) return '<section class="panel"><div class="empty">Архив доступен только админу.</div></section>';
      return `<section class="panel"><div class="panel-head"><h2>Архив лидов</h2><span class="muted">Удаление только после проверки руководителем</span></div><div class="panel-body">${leadsTable(state.leads.filter(l=>l.archived))}</div></section>`;
    }
    function audit() {
      return `<section class="panel"><div class="panel-head"><h2>Журнал за ${periodLabel()}</h2><span class="muted">Мелко, компактно, кликабельно</span></div><div class="panel-body"><div class="table-wrap"><table>
        <thead><tr><th>Время</th><th>Сотрудник</th><th>Действие</th><th>Объект</th><th>Детали</th><th>Было / стало</th></tr></thead>
        <tbody>${state.audit.map(a => `<tr class="clickable" onclick="openAudit(${a.id})"><td>${h(a.at)}</td><td>${h(employee(a.employeeId).name)}</td><td>${h(a.action)}</td><td>${h(a.type)} ${a.objectId || ''}</td><td>${h(a.details)}</td><td>${a.before || a.after ? `${h(a.before)} → ${h(a.after)}` : '<span class="muted">без изменения поля</span>'}</td></tr>`).join('')}</tbody></table></div></div></section>`;
    }

    function openLead(id) {
      const l = byId(state.leads, id);
      if (!l) return;
      const events = state.audit.filter(a => a.type === 'lead' && a.objectId === id);
      drawer(`<div class="drawer-head"><div><h2>${h(l.client)}</h2><div class="muted">${h(l.object)} · ${statusBadge(l.status)}</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <div class="drawer-body grid">
          <section class="panel"><div class="panel-body">
            <div class="grid three">
              <div><span class="muted">Источник</span><br>${sourceLink(source(l.sourceId))}</div>
              <div><span class="muted">Менеджер</span><br>${h(employee(l.managerId).name)}</div>
              <div><span class="muted">Следующий шаг</span><br>${h(l.nextAction)} · ${h(l.nextDate)}</div>
            </div>
            <p style="margin-top:12px">${h(l.notes)}</p>
            <div class="actions">
              ${state.role === 'manager' && l.managerId === currentEmployeeId() ? `<button onclick="quickTouch(${l.id})">Записать касание</button><button class="secondary" onclick="sendToMeasure(${l.id})">Передать в замер</button>` : ''}
              ${canSeeAll() ? `<button class="secondary" onclick="openLeadForm(${l.id})">Редактировать</button><button class="secondary" onclick="openLeadRequest(${l.id})">Запрос/правка</button><button class="danger" onclick="archiveLead(${l.id})">В архив</button>` : `<button class="secondary" onclick="openLeadRequest(${l.id})">Запросить правку</button>`}
            </div>
          </div></section>
          <section class="panel"><div class="panel-head"><h2>История действий</h2></div><div class="panel-body timeline">${events.map(ev => `<div class="event"><strong>${h(ev.action)}</strong><span>${h(ev.at)} · ${h(employee(ev.employeeId).name)} · ${h(ev.details)}</span></div>`).join('') || '<div class="muted">История пока пустая.</div>'}</div></section>
        </div>`);
    }
    function openSource(id) {
      const s = byId(state.sources, id);
      const leads = state.leads.filter(l => l.sourceId === id);
      drawer(`<div class="drawer-head"><div><h2>${h(s.name)}</h2><div class="muted">${h(s.type)} · владелец ${h(employee(s.ownerId).name)}</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <div class="drawer-body grid"><section class="panel"><div class="panel-body">
          <p>${s.link ? sourceLink(s) : 'Ссылки нет'}</p>
          <div class="grid three">
            <div class="notice"><strong>${leads.length}</strong><span>лидов</span></div>
            <div class="notice"><strong>${leads.filter(l=>l.status.includes('Замер')).length}</strong><span>замеров</span></div>
            <div class="notice"><strong>${leads.filter(l=>l.status.includes('Смет')).length}</strong><span>смет</span></div>
          </div>
          <div class="actions" style="margin-top:12px"><button onclick="setView('leads',{kind:'source',id:${id}});closeDrawer()">Открыть лиды</button><button class="secondary" onclick="openSourceRequest(${id})">Запросить правку</button></div>
        </div></section></div>`);
    }
    function openRequest(id) {
      const r = byId(state.requests, id);
      drawer(`<div class="drawer-head"><div><h2>Запрос #${r.id}</h2><div class="muted">${h(employee(r.employeeId).name)} · ${requestBadge(r.status)}</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <div class="drawer-body"><section class="panel"><div class="panel-body grid">
          <div class="notice"><strong>${h(r.field)}</strong><span>${h(r.reason)}</span></div>
          <div class="grid two"><div class="notice"><strong>Было</strong><span>${h(r.before)}</span></div><div class="notice"><strong>Стало</strong><span>${h(r.after)}</span></div></div>
          ${canApprove() && r.status === 'pending' ? `<div class="actions"><button onclick="approveRequest(${r.id})">Одобрить</button><button class="secondary" onclick="clarifyRequest(${r.id})">На уточнение</button><button class="danger" onclick="rejectRequest(${r.id})">Отклонить</button></div>` : ''}
        </div></section></div>`);
    }
    function openAudit(id) {
      const a = state.audit.find(x => x.id === id);
      if (!a) return;
      if (a.type === 'lead' && a.objectId) return openLead(a.objectId);
      drawer(`<div class="drawer-head"><div><h2>${h(a.action)}</h2><div class="muted">${h(a.at)}</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div><div class="drawer-body"><div class="notice"><strong>${h(a.details)}</strong><span>${h(a.before)} ${a.after ? '→ ' + h(a.after) : ''}</span></div></div>`);
    }
    function drawer(html) { const d = document.getElementById('drawer'); d.innerHTML = html; d.classList.add('open'); }
    function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

    function openLeadForm(id) {
      const l = id ? byId(state.leads, id) : {};
      drawer(`<div class="drawer-head"><div><h2>${id ? 'Редактировать лид' : 'Новый лид'}</h2><div class="muted">После создания защищенные поля сотрудник меняет через запрос.</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <form class="drawer-body form-grid" onsubmit="saveLead(event, ${id || 0})">
          <label>Клиент<input name="client" required value="${h(l.client || '')}"></label>
          <label>Телефон<input name="phone" value="${h(l.phone || '')}"></label>
          <label class="wide">Объект<input name="object" value="${h(l.object || '')}"></label>
          <label>Источник<select name="sourceId">${state.sources.map(s=>`<option value="${s.id}" ${l.sourceId===s.id?'selected':''}>${h(s.name)}</option>`).join('')}</select></label>
          <label>Статус<select name="status">${statuses.map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
          <label>Следующий шаг<input name="nextAction" value="${h(l.nextAction || '')}"></label>
          <label>Дата контроля<input type="date" name="nextDate" value="${h(l.nextDate || '')}"></label>
          <label class="wide">Комментарий<textarea name="notes">${h(l.notes || '')}</textarea></label>
          <div class="wide actions"><button>Сохранить</button><button type="button" class="secondary" onclick="closeDrawer()">Отмена</button></div>
        </form>`);
    }
    function saveLead(e, id) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.sourceId = Number(data.sourceId);
      if (id) {
        const l = byId(state.leads, id);
        if (!canSeeAll() && state.role === 'manager') return createRequest('lead', id, 'Карточка лида', l.client, data.client, 'Менеджер запросил правку карточки');
        Object.assign(l, data, { updatedAt: new Date().toISOString().slice(0,10) });
        addLog('lead', id, 'Лид изменен', data.client);
      } else {
        state.leads.push({ id: nextId(state.leads), ...data, managerId: currentEmployeeId(), measurerId: null, estimatorId: null, amountPre: 0, amountFinal: 0, archived: false, createdAt: new Date().toISOString().slice(0,10), updatedAt: new Date().toISOString().slice(0,10) });
        addLog('lead', nextId(state.leads)-1, 'Создан лид', data.client);
      }
      save(); closeDrawer(); render(); toast('Лид сохранен');
    }

    function openSourceForm() {
      drawer(`<div class="drawer-head"><div><h2>Новый источник</h2><div class="muted">Источник принадлежит сотруднику и имеет тип.</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <form class="drawer-body form-grid" onsubmit="saveSource(event)">
          <label>Название<input name="name" required></label>
          <label>Тип<select name="type">${sourceTypes.map(t=>`<option>${t}</option>`).join('')}</select></label>
          <label class="wide">Ссылка<input name="link" placeholder="https://..."></label>
          <div class="wide actions"><button>Сохранить</button><button type="button" class="secondary" onclick="closeDrawer()">Отмена</button></div>
        </form>`);
    }
    function saveSource(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      state.sources.push({ id: nextId(state.sources), ...data, ownerId: currentEmployeeId(), bonus: false });
      addLog('source', nextId(state.sources)-1, 'Создан источник', data.name);
      save(); closeDrawer(); render(); toast('Источник создан');
    }
    function openSourceRequest(id) {
      const s = byId(state.sources, id);
      createRequest('source', id, 'Источник', s.name, s.name + ' / уточнить тип или владельца', 'Запрос правки источника');
    }
    function openLeadRequest(id) {
      const l = byId(state.leads, id);
      createRequest('lead', id, 'Лид', l.client, l.client + ' / уточнить данные', 'Запрос правки лида');
    }
    function createRequest(type, objectId, field, before, after, reason) {
      state.requests.push({ id: nextId(state.requests), type, objectId, employeeId: currentEmployeeId(), field, before, after, reason, status: 'pending', createdAt: stamp() });
      addLog(type, objectId, 'Создан запрос правки', reason, before, after);
      save(); closeDrawer(); render(); toast('Запрос отправлен');
    }
    function approveRequest(id) {
      const r = byId(state.requests, id);
      r.status = 'approved';
      addLog(r.type, r.objectId, 'Запрос одобрен', r.reason, r.before, r.after);
      save(); closeDrawer(); render(); toast('Запрос одобрен');
    }
    function rejectRequest(id) {
      const r = byId(state.requests, id);
      r.status = 'rejected';
      addLog(r.type, r.objectId, 'Запрос отклонен', r.reason);
      save(); closeDrawer(); render(); toast('Запрос отклонен');
    }
    function clarifyRequest(id) {
      const r = byId(state.requests, id);
      r.status = 'clarify';
      addLog(r.type, r.objectId, 'Запрос отправлен на уточнение', r.reason);
      save(); closeDrawer(); render(); toast('Отправлено на уточнение');
    }

    function openEmployeeForm() {
      drawer(`<div class="drawer-head"><div><h2>Нанять сотрудника</h2><div class="muted">Доступы настраиваются через роль, база знаний отдельно.</div></div><button class="ghost" onclick="closeDrawer()">Закрыть</button></div>
        <form class="drawer-body form-grid" onsubmit="saveEmployee(event)">
          <label>ФИО<input name="name" required></label>
          <label>Дата рождения<input type="date" name="birth"></label>
          <label>Логин<input name="login" required></label>
          <label>Пароль<input name="password" value="demo123"></label>
          <label class="wide">Роль<select name="role">${Object.entries(roles).map(([id,r])=>`<option value="${id}">${r.title}</option>`).join('')}</select></label>
          <div class="wide actions"><button>Нанять</button><button type="button" class="secondary" onclick="closeDrawer()">Отмена</button></div>
        </form>`);
    }
    function saveEmployee(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      state.employees.push({ id: nextId(state.employees), name: data.name, role: data.role, active: true, login: data.login });
      addLog('employee', nextId(state.employees)-1, 'Сотрудник нанят', data.name);
      save(); closeDrawer(); render(); toast('Сотрудник нанят');
    }
    function fireEmployee(id) {
      const e = byId(state.employees, id);
      e.active = false;
      addLog('employee', id, 'Сотрудник уволен', e.name + ': доступ заблокирован');
      save(); render(); toast('Доступ заблокирован, база сохранена');
    }

    function changeLeadStatus(id, status) {
      const l = byId(state.leads, id);
      const before = l.status;
      l.status = status;
      l.updatedAt = new Date().toISOString().slice(0,10);
      addLog('lead', id, 'Статус изменен', l.client, before, status);
      save(); render(); toast(status);
    }
    function sendToMeasure(id) {
      const l = byId(state.leads, id);
      l.measurerId = 5;
      changeLeadStatus(id, 'Передан замерщику');
    }
    function handoffEstimate(id) {
      const l = byId(state.leads, id);
      l.estimatorId = 6;
      changeLeadStatus(id, 'Передан сметчику');
    }
    function finishEstimate(id) {
      const l = byId(state.leads, id);
      l.amountFinal = l.amountFinal || Math.max(l.amountPre || 0, 1200000);
      changeLeadStatus(id, 'Смета посчитана');
    }
    function quickTouch(id) {
      const l = byId(state.leads, id);
      addLog('lead', id, 'Касание записано', l.client + ': следующий контакт уточнен');
      save(); render(); openLead(id); toast('Касание записано');
    }
    function archiveLead(id) {
      const l = byId(state.leads, id);
      l.archived = true;
      addLog('lead', id, 'Лид отправлен в архив', l.client);
      save(); closeDrawer(); render(); toast('Лид в архиве');
    }
    function toggleKb(id) {
      const k = byId(state.kb, id);
      const idx = k.closedFor.indexOf(3);
      if (idx >= 0) k.closedFor.splice(idx, 1); else k.closedFor.push(3);
      addLog('knowledge', id, 'Изменен доступ к базе знаний', k.title);
      save(); render(); toast('Доступ обновлен');
    }
    function toast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    render();
  </script>
</body>
</html>
